name: Deploy

on:
  push:
    branches: [main]
    paths:
      - infra/**
      - Dockerfile
      - generate-dispatch.py
      - daily-digest.recipe
      - requirements.txt
      - .github/workflows/deploy.yml

permissions:
  contents: read

env:
  PROJECT_ID: daily-dispatch-504917
  REGION: us-central1
  REPO: daily-dispatch
  JOB_NAME: daily-dispatch

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      infra: ${{ steps.filter.outputs.infra }}
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@v4

      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            infra:
              - 'infra/**'
            code:
              - 'Dockerfile'
              - 'generate-dispatch.py'
              - 'daily-digest.recipe'
              - 'requirements.txt'

  deploy-infra:
    needs: changes
    if: needs.changes.outputs.infra == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - id: auth
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ env.PROJECT_ID }}
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.GCP_TOFU_SA }}

      - name: Set up OpenTofu
        uses: opentofu/setup-opentofu@v2

      - name: OpenTofu fmt
        id: fmt
        run: tofu -chdir=infra fmt -check
        continue-on-error: true

      - name: Initialize OpenTofu
        run: |
          tofu -chdir=infra init

      - name: Validate OpenTofu configuration
        run: |
          tofu -chdir=infra validate

      - name: Plan OpenTofu changes
        run: |
          tofu -chdir=infra plan

      - name: Apply OpenTofu changes
        run: |
          tofu -chdir=infra apply -auto-approve

  deploy-code:
    needs: [changes, deploy-infra]
    if: |
      always() &&
      needs.changes.outputs.code == 'true' &&
      (needs.deploy-infra.result == 'success' || needs.deploy-infra.result == 'skipped')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - id: auth
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ env.PROJECT_ID }}
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SA }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Build and push image
        run: |
          set -euo pipefail
          IMAGE="${REGION}-docker.pkg.dev/${PROJECT_ID}/${REPO}/${JOB_NAME}:${{ github.sha }}"

          # Submit async and poll build status instead of streaming logs:
          # the deploy service account can read build status but not the
          # default Cloud Build logs bucket, which makes a synchronous
          # `gcloud builds submit` exit 1 even after a successful build.
          BUILD_ID=$(gcloud builds submit --region="${REGION}" --tag="${IMAGE}" --async --format="value(id)" .)
          echo "Submitted build ${BUILD_ID}, polling for completion..."

          while true; do
            STATUS=$(gcloud builds describe "${BUILD_ID}" --region="${REGION}" --format="value(status)")
            case "${STATUS}" in
              SUCCESS)
                echo "Build ${BUILD_ID} succeeded."
                break
                ;;
              WORKING|QUEUED|PENDING)
                sleep 10
                ;;
              *)
                echo "Build ${BUILD_ID} ended with status: ${STATUS}" >&2
                exit 1
                ;;
            esac
          done

          echo "IMAGE=${IMAGE}" >> "$GITHUB_ENV"

      - name: Update Cloud Run Job
        run: |
          gcloud run jobs update "${JOB_NAME}" \
            --region="${REGION}" \
            --image="${IMAGE}"
